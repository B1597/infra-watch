<div class="node-detail">

  <div class="node-detail__breadcrumb">
    @if (sel.selection(); as selection) {
      @for (crumb of selection.path; track crumb.id; let last = $last) {
        @if (last) {
          <span class="node-detail__crumb node-detail__crumb--active">
            {{ crumb.name }}
          </span>
        } @else {
          <button class="node-detail__crumb node-detail__crumb--link"
                  [routerLink]="['/topology', crumb.id]">
            {{ crumb.name }}
          </button>
          <mat-icon class="node-detail__crumb-separator">chevron_right</mat-icon>
        }
      }
    }
  </div>

  <div class="node-detail__tabs">
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false" disableRipple>
      <a mat-tab-link
         routerLink="overview"
         routerLinkActive
         #overview="routerLinkActive"
         [active]="overview.isActive">
        Overview
      </a>
      <a mat-tab-link
         routerLink="configuration"
         routerLinkActive
         #configuration="routerLinkActive"
         [active]="configuration.isActive">
        Configuration
      </a>
      <a mat-tab-link
         routerLink="statistics"
         routerLinkActive
         #statistics="routerLinkActive"
         [active]="statistics.isActive">
        Statistics
      </a>
    </nav>
  </div>

  <mat-tab-nav-panel #tabPanel class="node-detail__content">
    <router-outlet />
  </mat-tab-nav-panel>

</div>
