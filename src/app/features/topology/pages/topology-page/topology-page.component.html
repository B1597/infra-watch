<div class="topology-page">

  <div class="topology-page__left" [class.topology-page__left--collapsed]="collapsed()">
    <div class="topology-page__left-header">
      @if (!collapsed()) {
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="topology-page__search">
          <mat-icon matPrefix>search</mat-icon>
          <input matInput placeholder="Search topology..." [value]="searchQuery()" (input)="onSearch($event)" />
        </mat-form-field>
      }
      <button class="topology-page__toggle" (click)="toggle()">
        <mat-icon>{{ collapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    @if (!collapsed()) {
      <app-topology-tree [filter]="searchQuery()" />
    }
  </div>

  <div class="topology-page__right">
    @if (!sel.selection()) {
      <div class="topology-page__empty">
        <div class="topology-page__empty-inner">
          <div class="topology-page__empty-graphic">
            <div class="topology-page__empty-circle">
              <mat-icon class="topology-page__empty-cursor">near_me</mat-icon>
            </div>
            <mat-icon class="topology-page__empty-float topology-page__empty-float--db">database</mat-icon>
            <mat-icon class="topology-page__empty-float topology-page__empty-float--server">view_list</mat-icon>
            <mat-icon class="topology-page__empty-float topology-page__empty-float--tree">account_tree</mat-icon>
          </div>
          <span class="topology-page__empty-label">Select a Node to View Details</span>
        </div>
      </div>
    }
    <router-outlet />
  </div>

</div>
