<div class="dashboard-skeleton">

  <!-- stat cards skeleton -->
  <div class="stat-cards-skeleton">
    @for (i of [1,2,3,4]; track i) {
      <div class="skeleton-card">
        <div class="skeleton-card__content">
          <app-skeleton-block width="80px" height="12px" />
          <app-skeleton-block width="60px" height="36px" radius="4px" />
          <app-skeleton-block width="120px" height="12px" />
          <app-skeleton-block width="90px" height="12px" />
        </div>
        <app-skeleton-block width="46px" height="46px" radius="8px" />
      </div>
    }
  </div>

  <!-- infrastructure overview skeleton -->
  <div class="skeleton-card">
    <app-skeleton-block width="160px" height="20px" />
    <app-skeleton-block width="220px" height="14px" />
    <div class="overview-grid-skeleton">
      @for (i of [1,2,3,4,5]; track i) {
        <div class="overview-item-skeleton">
          <app-skeleton-block width="48px" height="48px" radius="8px" />
          <app-skeleton-block width="40px" height="24px" radius="4px" />
          <app-skeleton-block width="64px" height="12px" />
        </div>
      }
    </div>
  </div>

  <!-- bottom row skeleton -->
  <div class="skeleton-bottom">

    <!-- system health skeleton -->
    <div class="skeleton-card">
      <app-skeleton-block width="140px" height="20px" />
      <app-skeleton-block width="200px" height="14px" />
      <div class="health-list-skeleton">
        @for (i of [1,2,3,4]; track i) {
          <div class="health-item-skeleton">
            <div class="health-item-skeleton__header">
              <app-skeleton-block width="140px" height="14px" />
              <app-skeleton-block width="36px" height="14px" />
            </div>
            <app-skeleton-block width="100%" height="4px" radius="2px" />
          </div>
        }
      </div>
    </div>

    <!-- recent alerts skeleton -->
    <div class="skeleton-card">
      <app-skeleton-block width="130px" height="20px" />
      <app-skeleton-block width="180px" height="14px" />
      <div class="alerts-list-skeleton">
        @for (i of [1,2,3,4,5]; track i) {
          <div class="alert-item-skeleton">
            <app-skeleton-block width="20px" height="20px" radius="50%" />
            <div class="alert-item-skeleton__body">
              <app-skeleton-block width="90%" height="13px" />
              <app-skeleton-block width="60%" height="11px" />
            </div>
          </div>
        }
      </div>
    </div>

  </div>

</div>
