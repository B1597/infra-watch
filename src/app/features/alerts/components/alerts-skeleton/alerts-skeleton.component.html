<div class="alerts-skeleton">
  @for (row of rows; track row) {
    <div class="alert-card-skeleton">

      <app-skeleton-block width="22px" height="22px" radius="50%" />

      <div class="alert-card-skeleton__body">
        <div class="alert-card-skeleton__top">
          <app-skeleton-block width="160px" height="15px" />
          <div class="alert-card-skeleton__badges">
            <app-skeleton-block width="50px" height="20px" radius="4px" />
            <app-skeleton-block width="50px" height="20px" radius="4px" />
          </div>
        </div>
        <app-skeleton-block width="65%" height="13px" />
        <app-skeleton-block width="20%" height="13px" />
        <div class="alert-card-skeleton__meta">
          <app-skeleton-block width="70px" height="20px" radius="4px" />
          <app-skeleton-block width="50px" height="12px" />
          <app-skeleton-block width="60px" height="12px" />
        </div>
        <div class="alert-card-skeleton__actions">
          <app-skeleton-block width="110px" height="30px" radius="4px" />
          <app-skeleton-block width="90px" height="30px" radius="4px" />
        </div>
      </div>

    </div>
  }
</div>
